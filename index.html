<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ekviterm">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#14213D">
<title>Ekvitermická krivka tepelného čerpadla Sinclair S-THERM Ontario</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EEF1F6;--card:#fff;--ink:#14213D;--mut:#667085;--line:#E3E8EF;--hd:#14213D;--org:#E8590C;--blue:#2F6FB3;
--inp:#FFF6D6;--inpink:#1D4ED8;--grid:#E9EDF2;--axis:#B8C0CC;--btn:#EEF2F8;--grn:#12A06B;--pur:#7C5CC4;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1420;--card:#172033;--ink:#E8ECF4;--mut:#93A0B5;--line:#26324A;--hd:#0B1220;--org:#FF7A33;--blue:#6FA8E8;--inp:#2B2A1A;--inpink:#9CC0FF;--grid:#222E45;--axis:#4A5873;--btn:#223049;--grn:#35D39A;--pur:#A78BFA;color-scheme:dark}}
:root[data-theme="dark"]{--grn:#35D39A;--pur:#A78BFA;--bg:#0E1420;--card:#172033;--ink:#E8ECF4;--mut:#93A0B5;--line:#26324A;--hd:#0B1220;--org:#FF7A33;--blue:#6FA8E8;--inp:#2B2A1A;--inpink:#9CC0FF;--grid:#222E45;--axis:#4A5873;--btn:#223049;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding-bottom:28px}
header{background:var(--hd);color:#fff;padding:18px 18px 16px;border-bottom:3px solid var(--org)}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
header p{margin:2px 0 0;font-size:13px;color:#A9B8CF}
.card{background:var(--card);border:1px solid var(--line);margin:12px 12px 0;padding:14px;border-radius:10px}
h2{margin:0 0 8px;font-size:15px;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.top>div:last-child{text-align:right}
.big{font-size:clamp(30px,9vw,52px);white-space:nowrap;font-weight:700;line-height:1;color:var(--org);letter-spacing:-.02em}
.lbl{font-size:13px;color:var(--mut)}
.sub{font-size:14px;color:var(--mut);margin-top:4px}
#chart{touch-action:pan-y;user-select:none;-webkit-user-select:none;margin:6px -4px 0}
#chart svg{display:block;width:100%;height:auto}
.t{fill:var(--mut);font-size:10px}.ax{stroke:var(--axis)}.gr{stroke:var(--grid)}
.ln{stroke:var(--org);stroke-width:3;fill:none;stroke-linecap:round}
.gd{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3;opacity:.45}
.dot{fill:var(--ink);stroke:var(--card);stroke-width:2.5}
.ctl{display:flex;align-items:center;gap:8px;margin-top:6px}
.ctl input[type=range]{flex:1;min-width:0;accent-color:var(--org);height:44px}
button{font:inherit;font-weight:700;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:8px;min-width:44px;height:44px;cursor:pointer;touch-action:manipulation}
button:active{background:var(--line)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.nm{flex:1;min-width:0;border-left:4px solid var(--blue);padding-left:10px}
.nm.o{border-color:var(--org)}.nm.g{border-color:var(--grn)}.nm.p{border-color:var(--pur)}
.big.g{color:var(--grn)}
.nm b{display:block;font-size:15px}.nm small{color:var(--mut);font-size:12px}
.in{display:flex;gap:4px;align-items:center}
.in input{width:76px;height:44px;text-align:center;font:inherit;font-size:17px;font-weight:700;color:var(--inpink);background:var(--inp);border:1px solid var(--line);border-radius:8px}
.in button{min-width:38px;padding:0}
.in input[type=number]{-moz-appearance:textfield;appearance:textfield}
.in input::-webkit-outer-spin-button,.in input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.err{margin:8px 0 0;color:#C62828;font-size:13px;min-height:0}
:root[data-theme="dark"] .err{color:#FF8A80}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#FF8A80}}
summary{cursor:pointer;font-weight:700;font-size:15px;min-height:28px}
summary span{font-weight:400;color:var(--mut);font-size:13px;margin-left:6px}
.blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.blocks h3{margin:0 0 4px;font-size:11px;font-weight:700;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:12.5px;text-align:center}
th{font-size:10px;font-weight:700;color:var(--mut);padding:2px 0 4px;border-bottom:2px solid var(--org)}
td{padding:3px 0;border-bottom:1px solid var(--line)}
tr.on td{font-weight:700;box-shadow:inset 0 0 0 2px var(--ink)}
footer{margin:14px 16px 0;font-size:12px;color:var(--mut)}
@media (prefers-reduced-motion:no-preference){.big{transition:opacity .12s}}
</style>
</head>
<body>
<main>
<header><h1>Ekvitermická krivka</h1><p>Výpočet požadovanej teploty vody na základe teploty vzduchu. </p></header>

<section class="card" aria-label="Rýchly výpočet">
  <div class="top">
    <div>
      <div class="lbl">Požadovaná teplota vody</div>
      <div class="big" id="wt" aria-live="polite">–</div>
      <div class="sub" id="atsub"></div>
    </div>
    <div>
      <div class="lbl">Štart vykurovania pri</div>
      <div class="big g" id="dtv" aria-live="polite">–</div>
      <div class="sub">parametra T-water out PE</div>
    </div>
  </div>
  <div id="chart"></div>
  <div class="ctl">
    <button id="tm" aria-label="Znížiť teplotu vzduchu">−</button>
    <input type="range" id="slider" aria-label="Teplota vzduchu">
    <button id="tp" aria-label="Zvýšiť teplotu vzduchu">+</button>
  </div>
</section>

<section class="card">
  <h2>Parametre</h2>
  <div id="params"></div>
  <p class="err" id="err" role="alert"></p>
</section>

<section class="card">
  <details>
    <summary>Tabuľka hodnôt<span id="npts"></span></summary>
    <div class="blocks" id="blocks"></div>
  </details>
</section>

<footer>Hodnoty sa ukladajú iba v tomto zariadení.</footer>
</main>

<script>
const KEY='ekviterm.v1', D={la:-18,ua:19,lw:33,uw:24,dt:3,st:.5,t:0};
let S={...D};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object')S={...D,...s}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const r1=v=>Math.round(v*10)/10;
const fmt=v=>r1(v).toFixed(1).replace('.',',').replace('-','−');
const FIELDS=[
 ['ua','Upper AT','Najvyššia teplota vzduchu',0,1],
 ['la','Lower AT','Najnižšia teplota vzduchu',0,1],
 ['lw','Lower WT','Dolná hranica teploty vody',1,1],
 ['uw','Upper WT','Horná hranica teploty vody',1,1],
 ['dt','ΔT','Hysterézia teploty',2,1],
 ['st','Krokovanie teploty','',3,.1]];

function check(s){
 if(![s.la,s.ua,s.lw,s.uw,s.dt,s.st].every(Number.isFinite)) return 'Vyplň všetky hodnoty číslami.';
 if(s.la<-25||s.ua>25) return 'Teplota vzduchu môže byť v rozmedzí od −25 do +25 °C.';
 if(s.la>=s.ua) return 'Upper AT musí byť väčšie ako Lower AT.';
 if(s.dt<0) return 'ΔT nemôže byť záporné.';
 if(s.st<=0) return 'Krok tabuľky teplôt musí byť kladné číslo.';
 if((s.ua-s.la)/s.st>400) return 'Krok je príliš malý, zväčši ho.';
 return '';
}
const wtAt=at=>S.lw+(S.uw-S.lw)*(Math.min(S.ua,Math.max(S.la,at))-S.la)/(S.ua-S.la);
const niceStep=r=>{const t=r/5;return [1,2,5,10,20].find(x=>x>=t)||20};

/* ---- parametre ---- */
$('params').innerHTML=FIELDS.map(([k,n,h,o])=>
 `<div class="row"><div class="nm${[' ',' o',' g',' p'][o]}"><b>${n}</b>${h?`<small>${h}</small>`:''}</div>
  <div class="in"><button data-k="${k}" data-d="-1" aria-label="${n} menej">−</button>
  <input type="number" step="any" id="f_${k}" aria-label="${n}" value="${S[k]}">
  <button data-k="${k}" data-d="1" aria-label="${n} viac">+</button></div></div>`).join('');
FIELDS.forEach(([k])=>$('f_'+k).addEventListener('input',e=>{S[k]=e.target.value===''?NaN:parseFloat(e.target.value);renderAll()}));

$('params').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const k=b.dataset.k,d=+b.dataset.d,step=FIELDS.find(f=>f[0]===k)[4];
 const cur=Number.isFinite(S[k])?S[k]:D[k];
 let v=(k==='st'?cur:Math.round(cur))+d*step; v=Math.round(v*100)/100;
 if(k==='st'&&v<=0)v=.1;
 S[k]=v;$('f_'+k).value=v;renderAll();
});

/* ---- graf ---- */
const W=360,H=250,M={l:40,r:14,t:12,b:34};
let G=null;
function drawChart(){
 const xmin=-25,xmax=25;
 const lo=Math.min(S.lw,S.uw),hi=Math.max(S.lw,S.uw),ys=niceStep(hi-lo+4);
 const ymin=Math.floor((lo-1)/ys)*ys,ymax=Math.ceil((hi+1)/ys)*ys;
 const sx=x=>M.l+(x-xmin)/(xmax-xmin)*(W-M.l-M.r),sy=y=>H-M.b-(y-ymin)/(ymax-ymin)*(H-M.t-M.b);
 G={xmin,xmax,sx};
 let g='';
 for(let x=xmin;x<=xmax;x+=5)g+=`<line class="gr" x1="${sx(x)}" x2="${sx(x)}" y1="${M.t}" y2="${H-M.b}"/><text class="t" x="${sx(x)}" y="${H-M.b+14}" text-anchor="middle">${x}</text>`;
 for(let y=ymin;y<=ymax;y+=ys)g+=`<line class="gr" x1="${M.l}" x2="${W-M.r}" y1="${sy(y)}" y2="${sy(y)}"/><text class="t" x="${M.l-6}" y="${sy(y)+3}" text-anchor="end">${y}</text>`;
 g+=`<line class="ax" x1="${M.l}" x2="${W-M.r}" y1="${H-M.b}" y2="${H-M.b}"/><line class="ax" x1="${M.l}" x2="${M.l}" y1="${M.t}" y2="${H-M.b}"/>`;
 g+=`<text class="t" x="${(M.l+W-M.r)/2}" y="${H-4}" text-anchor="middle">Teplota vzduchu (°C)</text>`;
 g+=`<text class="t" transform="translate(11 ${(M.t+H-M.b)/2}) rotate(-90)" text-anchor="middle">Teplota vody (°C)</text>`;
 g+=`<line class="ln" x1="${sx(S.la)}" y1="${sy(S.lw)}" x2="${sx(S.ua)}" y2="${sy(S.uw)}"/>`;
 const cx=sx(S.t),cy=sy(wtAt(S.t));
 g+=`<line class="gd" x1="${cx}" x2="${cx}" y1="${cy}" y2="${H-M.b}"/><line class="gd" x1="${M.l}" x2="${cx}" y1="${cy}" y2="${cy}"/><circle class="dot" cx="${cx}" cy="${cy}" r="8"/>`;
 $('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graf ekvitermickej krivky">${g}</svg>`;
}
function pick(e){
 if(!G)return;
 const r=$('chart').getBoundingClientRect(),vx=(e.clientX-r.left)/r.width*W;
 let v=G.xmin+(vx-M.l)/(W-M.l-M.r)*(G.xmax-G.xmin);
 v=Math.round((v-S.la)/S.st)*S.st+S.la;
 setT(v);
}
let drag=false;
$('chart').addEventListener('pointerdown',e=>{drag=true;try{$('chart').setPointerCapture(e.pointerId)}catch(x){}pick(e)});
$('chart').addEventListener('pointermove',e=>{if(drag)pick(e)});
['pointerup','pointercancel'].forEach(t=>$('chart').addEventListener(t,()=>drag=false));

/* ---- vonkajšia teplota t ---- */
function setT(v){S.t=Math.round(Math.min(S.ua,Math.max(S.la,v))*100)/100;renderT();save()}
$('slider').addEventListener('input',e=>setT(+e.target.value));
$('tm').addEventListener('click',()=>setT(S.t-S.st));
$('tp').addEventListener('click',()=>setT(S.t+S.st));
function renderT(){
 const w=wtAt(S.t);
 $('wt').textContent=fmt(w)+' °C';
 const off=S.dt+0.1;
 $('dtv').textContent=fmt(w-off)+' °C';
 $('atsub').textContent='pri teplote vzduchu '+fmt(S.t)+' °C';
 $('slider').value=S.t;
 drawChart();
 const i=Math.round((S.t-S.la)/S.st);
 document.querySelectorAll('#blocks tr.on').forEach(x=>x.classList.remove('on'));
 const row=document.querySelector(`#blocks tr[data-i="${i}"]`);if(row)row.classList.add('on');
}

/* ---- tabuľka ---- */
function drawTable(){
 const n=Math.floor(Math.round((S.ua-S.la)/S.st*1e6)/1e6)+1,size=Math.ceil(n/3);
 const lo=Math.min(S.lw,S.uw),hi=Math.max(S.lw,S.uw);
 const pts=Array.from({length:n},(_,i)=>{const at=Math.min(S.ua,S.la+i*S.st);return [i,at,wtAt(at)]});
 let html='';
 for(let b=0;b<3;b++){
  const part=pts.slice(b*size,(b+1)*size);if(!part.length)continue;
  html+=`<div><h3>${fmt(part[0][1])} až ${fmt(part[part.length-1][1])} °C</h3><table><thead><tr><th>Vonku</th><th>Voda</th></tr></thead><tbody>`+
  part.map(([i,at,w])=>{
   const a=.30-.24*((at-S.la)/(S.ua-S.la)),c=hi===lo?.2:.06+.34*((w-lo)/(hi-lo));
   return `<tr data-i="${i}"><td style="background:rgba(47,111,179,${a.toFixed(2)})">${fmt(at)}</td><td style="background:rgba(232,89,12,${c.toFixed(2)})">${fmt(w)}</td></tr>`}).join('')+
  `</tbody></table></div>`;
 }
 $('blocks').innerHTML=html;
 $('npts').textContent=n+' bodov';
}

function renderAll(){
 const e=check(S);$('err').textContent=e;
 if(e)return;
 S.t=Math.min(S.ua,Math.max(S.la,S.t));
 const sl=$('slider');sl.min=S.la;sl.max=S.ua;sl.step=S.st;
 drawTable();renderT();save();
}
renderAll();

/* ikona pre plochu iPhonu */
try{const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');
 g.fillStyle='#14213D';g.fillRect(0,0,180,180);g.strokeStyle='#E8590C';g.lineWidth=14;g.lineCap='round';
 g.beginPath();g.moveTo(34,56);g.lineTo(146,122);g.stroke();
 g.fillStyle='#fff';g.beginPath();g.arc(90,89,12,0,7);g.fill();
 const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)}catch(e){}
</script>
</body>
</html>
